<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target IIT 2027: Chapter Reclamation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18",
        "react-dom/client": "https://esm.sh/react-dom@18/client",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0?deps=react@18",
        "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js"
      }
    }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
import React, { useState, useEffect } from 'react';
import { 
  CheckCircle2, Circle, Brain, Target, BookOpen, PenTool, 
  Calculator, Activity, Clock, ChevronDown, ChevronUp, Award,
  ArrowLeft, Plus, Trash2, BookMarked
} from 'lucide-react';

// --- FIREBASE SETUP ---
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, set, onValue, push, remove } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyBi5lo0y_1kOdSwRfOJot_VCIwk2XiVzfk",
  authDomain: "jee-strategy-bhl.firebaseapp.com",
  databaseURL: "https://jee-strategy-bhl-default-rtdb.firebaseio.com/",
  projectId: "jee-strategy-bhl",
  storageBucket: "jee-strategy-bhl.firebasestorage.app",
  messagingSenderId: "980647807748",
  appId: "1:980647807748:web:05f9b6f9d6fafde5b21e51",
  measurementId: "G-GSK0SRRJGN"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
// ----------------------

const StrategyGuide = () => {
  const [chapters, setChapters] = useState({});
  const [activeChapterId, setActiveChapterId] = useState(null);
  const [newChapterName, setNewChapterName] = useState("");
  const [expandedStep, setExpandedStep] = useState(0);
  const [isLoading, setIsLoading] = useState(true);

  // Read all chapters from Database on Load
  useEffect(() => {
    const chaptersRef = ref(db, 'myJeeProgress/chapters');
    const unsubscribe = onValue(chaptersRef, (snapshot) => {
      const data = snapshot.val();
      setChapters(data || {});
      setIsLoading(false);
    });
    return () => unsubscribe();
  }, []);

  // Add a new chapter
  const handleAddChapter = (e) => {
    e.preventDefault();
    if (!newChapterName.trim()) return;
    
    const newChapterRef = push(ref(db, 'myJeeProgress/chapters'));
    set(newChapterRef, {
      name: newChapterName.trim(),
      completedSteps: []
    });
    setNewChapterName("");
  };

  // Delete a chapter
  const handleDeleteChapter = (id, e) => {
    e.stopPropagation();
    const confirmDelete = window.confirm("Are you sure you want to delete this chapter?");
    if (confirmDelete) {
      remove(ref(db, `myJeeProgress/chapters/${id}`));
      if (activeChapterId === id) setActiveChapterId(null);
    }
  };

  // Toggle checklist step for the ACTIVE chapter
  const markComplete = (index, e) => {
    e.stopPropagation();
    if (!activeChapterId) return;

    // Firebase can sometimes drop empty arrays, so we ensure it defaults to []
    const currentCompleted = chapters[activeChapterId].completedSteps || [];
    let newCompletedSteps;
    
    if (currentCompleted.includes(index)) {
      newCompletedSteps = currentCompleted.filter(i => i !== index);
    } else {
      newCompletedSteps = [...currentCompleted, index];
      if (expandedStep === index) {
        setExpandedStep(index + 1);
      }
    }
    
    // Save to Firebase under that specific chapter
    set(ref(db, `myJeeProgress/chapters/${activeChapterId}/completedSteps`), newCompletedSteps);
  };

  const toggleStep = (index) => {
    setExpandedStep(expandedStep === index ? null : index);
  };

  if (isLoading) {
    return <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center">Loading your workspace...</div>;
  }

  // ==========================================
  // VIEW 1: DASHBOARD (List of Chapters)
  // ==========================================
  if (!activeChapterId) {
    return (
      <div className="min-h-screen bg-slate-900 text-slate-200 p-4 md:p-8 font-sans">
        <div className="max-w-4xl mx-auto">
          
          <div className="bg-slate-800 rounded-2xl p-6 md:p-8 mb-8 shadow-xl border border-slate-700">
            <div className="flex items-center gap-4 mb-4">
              <Award className="w-10 h-10 text-yellow-400" />
              <h1 className="text-2xl md:text-4xl font-bold text-white">JEE 2027: Chapter Tracker</h1>
            </div>
            <p className="text-slate-400 text-sm md:text-base leading-relaxed mb-6">
              Add forgotten Class 11 chapters below. Click on a chapter to open its specific reclamation protocol and track your progress.
            </p>

            {/* Add Chapter Form */}
            <form onSubmit={handleAddChapter} className="flex gap-2">
              <input 
                type="text" 
                placeholder="e.g., Rotational Motion, Electrostatics..." 
                value={newChapterName}
                onChange={(e) => setNewChapterName(e.target.value)}
                className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
              />
              <button 
                type="submit" 
                className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2"
              >
                <Plus className="w-5 h-5" /> Add
              </button>
            </form>
          </div>

          {/* List of Chapters */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {Object.entries(chapters).map(([id, chapter]) => {
              const completed = chapter.completedSteps || [];
              const progress = Math.round((completed.length / steps.length) * 100);
              
              return (
                <div 
                  key={id} 
                  onClick={() => { setActiveChapterId(id); setExpandedStep(0); }}
                  className="bg-slate-800 border border-slate-700 rounded-xl p-5 cursor-pointer hover:border-indigo-500 hover:shadow-lg hover:-translate-y-1 transition-all group"
                >
                  <div className="flex justify-between items-start mb-4">
                    <div className="flex items-center gap-3">
                      <BookMarked className="text-indigo-400 w-5 h-5" />
                      <h3 className="text-lg font-semibold text-white group-hover:text-indigo-300 transition-colors">
                        {chapter.name}
                      </h3>
                    </div>
                    <button 
                      onClick={(e) => handleDeleteChapter(id, e)}
                      className="text-slate-500 hover:text-red-400 transition-colors p-1"
                    >
                      <Trash2 className="w-4 h-4" />
                    </button>
                  </div>
                  
                  {/* Mini Progress Bar */}
                  <div className="flex justify-between text-xs text-slate-400 mb-2">
                    <span>{progress === 100 ? 'Reclaimed!' : 'Progress'}</span>
                    <span>{progress}%</span>
                  </div>
                  <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden">
                    <div 
                      className={`h-2 rounded-full transition-all duration-500 ${progress === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}`}
                      style={{ width: `${progress}%` }}
                    ></div>
                  </div>
                </div>
              );
            })}
            
            {Object.keys(chapters).length === 0 && (
              <div className="col-span-1 md:col-span-2 text-center py-12 text-slate-500 border-2 border-dashed border-slate-700 rounded-xl">
                No chapters added yet. Add your first forgotten chapter above!
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ==========================================
  // VIEW 2: CHECKLIST (For a specific chapter)
  // ==========================================
  
  // Get data for the currently active chapter
  const activeChapterData = chapters[activeChapterId];
  const activeCompletedSteps = activeChapterData.completedSteps || [];
  const activeProgress = Math.round((activeCompletedSteps.length / steps.length) * 100);

  return (
    <div className="min-h-screen bg-slate-900 text-slate-200 p-4 md:p-8 font-sans">
      <div className="max-w-4xl mx-auto">
        
        {/* Back Button */}
        <button 
          onClick={() => setActiveChapterId(null)}
          className="text-indigo-400 hover:text-indigo-300 flex items-center gap-2 mb-6 font-medium transition-colors"
        >
          <ArrowLeft className="w-5 h-5" /> Back to Dashboard
        </button>

        {/* Header Section */}
        <div className="bg-slate-800 rounded-2xl p-6 md:p-8 mb-8 shadow-xl border border-slate-700">
          <h2 className="text-xl text-indigo-400 font-medium mb-1">Reclamation Protocol For:</h2>
          <h1 className="text-3xl md:text-4xl font-bold text-white mb-6">{activeChapterData.name}</h1>
          
          {/* Progress Bar */}
          <div className="space-y-2">
            <div className="flex justify-between text-sm font-medium">
              <span className="text-slate-300">Chapter Progress</span>
              <span className={activeProgress === 100 ? 'text-emerald-400' : 'text-indigo-400'}>{activeProgress}%</span>
            </div>
            <div className="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
              <div 
                className={`h-3 rounded-full transition-all duration-500 ease-out ${activeProgress === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}`}
                style={{ width: `${activeProgress}%` }}
              ></div>
            </div>
          </div>
        </div>

        {/* Steps List */}
        <div className="space-y-4">
          {steps.map((step, index) => {
            const isCompleted = activeCompletedSteps.includes(index);
            const isExpanded = expandedStep === index;
            const Icon = step.icon;

            return (
              <div 
                key={index} 
                className={`bg-slate-800 rounded-xl border transition-all duration-300 ${
                  isCompleted ? 'border-emerald-500/30' : 
                  isExpanded ? 'border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.2)]' : 'border-slate-700'
                }`}
              >
                {/* Step Header */}
                <div 
                  className="p-4 flex items-center justify-between cursor-pointer group"
                  onClick={() => toggleStep(index)}
                >
                  <div className="flex items-center gap-4 flex-1">
                    <button 
                      onClick={(e) => markComplete(index, e)}
                      className="
