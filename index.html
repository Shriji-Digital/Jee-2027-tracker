<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target IIT 2027: Chapter Reclamation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18",
        "react-dom/client": "https://esm.sh/react-dom@18/client",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0?deps=react@18",
        "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js"
      }
    }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
import React, { useState, useEffect } from 'react';
import { 
  CheckCircle2, Circle, Brain, Target, BookOpen, PenTool, 
  Calculator, Activity, Clock, ChevronDown, ChevronUp, Award
} from 'lucide-react';

// --- FIREBASE SETUP ---
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, set, onValue } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyBi5lo0y_1kOdSwRfOJot_VCIwk2XiVzfk",
  authDomain: "jee-strategy-bhl.firebaseapp.com",
  databaseURL: "https://jee-strategy-bhl-default-rtdb.firebaseio.com/",
  projectId: "jee-strategy-bhl",
  storageBucket: "jee-strategy-bhl.firebasestorage.app",
  messagingSenderId: "980647807748",
  appId: "1:980647807748:web:05f9b6f9d6fafde5b21e51",
  measurementId: "G-GSK0SRRJGN"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
// ----------------------

const StrategyGuide = () => {
  const [completedSteps, setCompletedSteps] = useState([]);
  const [expandedStep, setExpandedStep] = useState(0);
  const [isLoading, setIsLoading] = useState(true);

  // Read from Database on Load
  useEffect(() => {
    const progressRef = ref(db, 'myJeeProgress/completedSteps');
    const unsubscribe = onValue(progressRef, (snapshot) => {
      const data = snapshot.val();
      // If data exists, set it. Otherwise, default to empty array [].
      setCompletedSteps(data || []);
      setIsLoading(false);
    });

    // Cleanup listener on unmount
    return () => unsubscribe();
  }, []);

  const toggleStep = (index) => {
    setExpandedStep(expandedStep === index ? null : index);
  };

  const markComplete = (index, e) => {
    e.stopPropagation();
    let newCompletedSteps;
    
    if (completedSteps.includes(index)) {
      newCompletedSteps = completedSteps.filter(i => i !== index);
    } else {
      newCompletedSteps = [...completedSteps, index];
      if (expandedStep === index) {
        setExpandedStep(index + 1);
      }
    }

    // Instantly update local state for speed
    setCompletedSteps(newCompletedSteps);
    
    // Save to Firebase
    set(ref(db, 'myJeeProgress/completedSteps'), newCompletedSteps);
  };

  const progress = Math.round((completedSteps.length / steps.length) * 100);

  if (isLoading) {
    return <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center">Loading your progress...</div>;
  }

  return (
    <div className="min-h-screen bg-slate-900 text-slate-200 p-4 md:p-8 font-sans">
      <div className="max-w-4xl mx-auto">
        
        {/* Header Section */}
        <div className="bg-slate-800 rounded-2xl p-6 md:p-8 mb-8 shadow-xl border border-slate-700">
          <div className="flex items-center gap-4 mb-4">
            <Award className="w-10 h-10 text-yellow-400" />
            <h1 className="text-2xl md:text-4xl font-bold text-white">Target IIT 2027: Chapter Reclamation Protocol</h1>
          </div>
          <p className="text-slate-400 text-sm md:text-base leading-relaxed mb-6">
            As a Class 12 student building focus, do NOT waste time re-reading whole textbooks for forgotten Class 11 chapters. 
            Follow this scientifically-backed, step-by-step checklist to drag a forgotten chapter from zero to JEE Advanced level.
          </p>
          
          {/* Progress Bar */}
          <div className="space-y-2">
            <div className="flex justify-between text-sm font-medium">
              <span className="text-indigo-400">Reclamation Progress</span>
              <span className="text-indigo-400">{progress}%</span>
            </div>
            <div className="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
              <div 
                className="bg-indigo-500 h-3 rounded-full transition-all duration-500 ease-out"
                style={{ width: `${progress}%` }}
              ></div>
            </div>
          </div>
        </div>

        {/* Steps List */}
        <div className="space-y-4">
          {steps.map((step, index) => {
            const isCompleted = completedSteps.includes(index);
            const isExpanded = expandedStep === index;
            const Icon = step.icon;

            return (
              <div 
                key={index} 
                className={`bg-slate-800 rounded-xl border transition-all duration-300 ${
                  isCompleted ? 'border-emerald-500/30' : 
                  isExpanded ? 'border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.2)]' : 'border-slate-700'
                }`}
              >
                {/* Step Header */}
                <div 
                  className="p-4 flex items-center justify-between cursor-pointer group"
                  onClick={() => toggleStep(index)}
                >
                  <div className="flex items-center gap-4 flex-1">
                    <button 
                      onClick={(e) => markComplete(index, e)}
                      className="focus:outline-none transition-transform hover:scale-110"
                    >
                      {isCompleted ? (
                        <CheckCircle2 className="w-7 h-7 text-emerald-400" />
                      ) : (
                        <Circle className="w-7 h-7 text-slate-500 group-hover:text-indigo-400" />
                      )}
                    </button>
                    <div>
                      <h3 className={`font-semibold text-lg ${isCompleted ? 'text-emerald-400 line-through opacity-70' : 'text-white'}`}>
                        Step {index + 1}: {step.title}
                      </h3>
                      <p className="text-slate-400 text-sm hidden md:block">{step.shortDesc}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-4">
                    <Icon className={`w-6 h-6 ${isCompleted ? 'text-emerald-500 opacity-50' : 'text-indigo-400'}`} />
                    {isExpanded ? <ChevronUp className="w-5 h-5 text-slate-500" /> : <ChevronDown className="w-5 h-5 text-slate-500" />}
                  </div>
                </div>

                {/* Step Content */}
                {isExpanded && (
                  <div className="px-4 pb-5 pt-2 ml-11 border-t border-slate-700 mt-2">
                    <div className="text-slate-300 space-y-4">
                      <p className="font-medium text-indigo-300">{step.directive}</p>
                      <ul className="space-y-2">
                        {step.details.map((detail, idx) => (
                          <li key={idx} className="flex items-start gap-2 text-sm leading-relaxed">
                            <span className="text-indigo-400 mt-1">•</span>
                            <span>{detail}</span>
                          </li>
                        ))}
                      </ul>
                      
                      {step.specialBox && (
                        <div className="mt-4 bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
                          <h4 className="text-sm font-semibold text-amber-400 mb-2">{step.specialBox.title}</h4>
                          <p className="text-sm text-slate-400">{step.specialBox.content}</p>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Motivation Footer */}
        {progress === 100 && (
          <div className="mt-8 bg-emerald-900/40 border border-emerald-500/30 rounded-2xl p-6 text-center animate-pulse">
            <h2 className="text-2xl font-bold text-emerald-400 mb-2">Chapter Successfully Reclaimed!</h2>
            <p className="text-emerald-200">You've successfully converted a forgotten topic into an exam-ready asset. Keep this momentum going for 2027!</p>
          </div>
        )}
      </div>
    </div>
  );
};

const steps = [
  {
    title: "The Cold Diagnostic Test",
    shortDesc: "Never start by reading the textbook.",
    icon: Activity,
    directive: "Take a 10-15 question PYQ test (JEE Main level) right now, without any prior revision.",
    details: [
      "Accept that forgetting is biological. Don't panic.",
      "Resist the urge to read old notes. This creates a 'theory loop' and wastes time.",
      "Attempt the test strictly under a timer."
    ],
    specialBox: {
      title: "Score Analysis",
      content: "Above 75%: Just review formulas. 30%-60%: Revise only the sub-topics you got wrong. Below 30%: You need a fast-tracked rebuild using condensed lectures/short notes."
    }
  },
  {
    title: "Reverse Revision (80/20 Rule)",
    shortDesc: "Problem solving comes first.",
    icon: Target,
    directive: "Dedicate 80% of your time to active problem solving and only 20% to theory.",
    details: [
      "Pick a problem and try to construct the logic from latent memory.",
      "Only go back and read theory if you are completely stuck on that specific problem.",
      "If you fail to start a problem, read ONLY the exact sub-topic required for it, nothing more."
    ]
  },
  {
    title: "Visual Note Compression",
    shortDesc: "Compress 50 pages into 2 pages.",
    icon: PenTool,
    directive: "Create hyper-dense 'Short Notes' while actively solving problems.",
    details: [
      "Do NOT blindly copy class notes. Spend max 2 minutes scanning a page of old notes.",
      "Draw visual maps. E.g., put all Projectile Motion formulas onto a single drawing of a parabola.",
      "Only create these notes AFTER you have struggled with PYQs, so you include exactly what you tend to forget."
    ]
  },
  {
    title: "Subject-Specific Tactics",
    shortDesc: "Treat Physics, Chem, and Math differently.",
    icon: BookOpen,
    directive: "Apply the specific cognitive strategy required for the subject.",
    details: [
      "Physics: Focus purely on drawing accurate Free Body Diagrams (FBDs) and identifying sign convention traps.",
      "Chemistry (Organic): Practice 'blind recall' of reaction mechanisms without looking at notes.",
      "Chemistry (Inorganic): Use daily flashcards for exceptions to periodic trends.",
      "Math: Scramble your practice (mix chapters) to build 'Tool Selection' skills."
    ]
  },
  {
    title: "Build the Mistake Log",
    shortDesc: "Don't just nod at the printed solutions.",
    icon: Brain,
    directive: "Create a highly structured Error Notebook for every mistake made in practice.",
    details: [
      "Don't copy the whole question. That wastes time.",
      "Log 4 things: Topic, Error Type (Silly, Concept, Reading), The Correct Logic, and an Actionable Takeaway.",
      "Use the 3R Method: Reattempt the failed question after a few days -> Revise the concept if you fail again -> Reinforce with 5 similar questions."
    ]
  },
  {
    title: "x² Spaced Repetition",
    shortDesc: "Defeat the forgetting curve permanently.",
    icon: Clock,
    directive: "Schedule the review of your new 2-page short notes using the x² formula.",
    details: [
      "Day 0: Today (you reclaimed the chapter).",
      "Day 1 (1²): Review short notes tomorrow.",
      "Day 4 (2²): Review again in 4 days.",
      "Day 9 (3²): Review again in 9 days, then 16 days, then 25 days.",
      "Use 'Mental Mapping' during these reviews: close your eyes and walk through the chapter structure mentally."
    ]
  },
  {
    title: "Manage Time & Sleep (60-30-10)",
    shortDesc: "Balance Class 12 with Class 11 revision.",
    icon: Calculator,
    directive: "Organize your daily routine to accommodate revision without halting current progress.",
    details: [
      "60% Time: Current Class 12 topics.",
      "30% Time: Revising forgotten Class 11 chapters using this checklist.",
      "10% Time: Hard, out-of-the-box advanced questions.",
      "CRITICAL: Get 6 to 8 hours of sleep. Memory consolidation only happens during deep sleep. Sacrificing sleep destroys your revision."
    ]
  }
];

import { createRoot } from 'react-dom/client';
const root = createRoot(document.getElementById('root'));
root.render(<StrategyGuide />);
    </script>
</body>
  </html>
